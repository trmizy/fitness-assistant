base_model: meta-llama/Llama-3.2-3B-Instruct
output_dir: training/outputs/fitness-coach-qlora
train_file: training/data/processed/train.jsonl
eval_file: training/data/processed/eval.jsonl
max_seq_length: 2048
learning_rate: 0.0002
num_train_epochs: 2
max_steps: null
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
load_in_4bit: true
bf16: true
save_steps: 100
eval_steps: 100
logging_steps: 10
