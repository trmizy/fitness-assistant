server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API access, mirroring vite.config.ts's dev proxy: the
  # browser only ever talks to this one origin (the EC2 host, whatever its
  # IP/hostname is at request time), and nginx forwards server-side over the
  # Docker network. This avoids CORS and mixed-content issues entirely —
  # both real blockers if the frontend instead called an absolute
  # http://<ec2-ip>:3000 baked in at build time (see api.ts / vite.config.ts
  # comments for the same reasoning applied to the dev proxy).
  location /api/ {
    proxy_pass http://api-gateway:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Gateway's own Socket.IO (dashboard/notifications/chat-intent AI).
  location /socket.io/ {
    proxy_pass http://api-gateway:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # No /chat-socket.io block here: chat-service is out of MVP scope for this
  # deployment (see infra/compose/docker-compose.prod.yml and the FCAJ
  # report's Proposal §9) — a static proxy_pass to a hostname that doesn't
  # exist in this compose file would fail nginx's own startup DNS
  # resolution. Add it back if chat-service is ever added to this compose
  # file, matching vite.config.ts's "/chat-socket.io" dev proxy.

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
