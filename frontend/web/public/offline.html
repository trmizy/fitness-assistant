<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <title>Fitness AI - Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(11, 16, 32, 0.7), rgba(11, 16, 32, 0.92)),
          url("/bg-gym.jpg") center / cover;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 8px;
        padding: 28px;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      img {
        width: 56px;
        height: 56px;
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      p {
        margin: 0 0 20px;
        color: #cbd5e1;
        line-height: 1.55;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 12px 16px;
        background: #16a34a;
        color: #052e16;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon.svg" alt="" />
      <h1>Dang mat ket noi</h1>
      <p>
        Fitness AI da luu san shell co ban. Ket noi lai mang de dong bo du lieu
        moi nhat va tiep tuc cac thao tac can may chu.
      </p>
      <button type="button" onclick="window.location.reload()">Thu lai</button>
    </main>
  </body>
</html>
