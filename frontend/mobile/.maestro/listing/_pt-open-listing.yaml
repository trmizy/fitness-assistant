# Subflow: after login -> PT workspace (switching from the client workspace if needed) -> Hồ sơ -> Tin đăng.
appId: vn.fitnessassistant.app
---
- extendedWaitUntil:
    visible: "Trang chủ|Tổng quan"
    timeout: 40000
- runFlow:
    when:
      visible: "Trang chủ"
    commands:
      - tapOn: "Cá nhân"
      - scrollUntilVisible:
          element: "Vào không gian Huấn luyện viên"
      - tapOn: "Vào không gian Huấn luyện viên"
- tapOn: "Hồ sơ"
- scrollUntilVisible:
    element: "Tin đăng"
- tapOn: "Tin đăng"
# U2-era retune: the "Lịch làm việc" card now sits above the status card, so on a 1080x2400 phone "Trạng thái tin đăng" is below the fold
- scrollUntilVisible:
    element: "Trạng thái tin đăng"
