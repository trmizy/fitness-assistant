# TEMPORARY capabilities for the business-seed run only (Tier A + B, `--target official --tier all`). Stack it LAST:
#
#   docker compose -f infra/compose/docker-compose.dev.yml -f scripts/seed-marketplace/official/compose.official.override.yml `
#       -f scripts/seed-marketplace/official/compose.official.seed.override.yml up -d --no-deps --force-recreate `
#       auth-service user-service gym-service payment-service chat-service api-gateway
#
# AFTER the seed, recreate the same services with ONLY compose.official.override.yml (no seed file): that turns every flag below back
# off. Nothing here may outlive the seed run:
#   VNPAY_SIMULATE=true             the seed pays play-money contracts through the local VNPay simulator page (payment-service refuses it when NODE_ENV=production)
#   PARTNER_APPLICATION_DEV_ECHO    the owner e-mail link is returned in the response instead of mailed (auth + gym)
#   RATE_LIMIT_MAX_REQUESTS ...     the seed sends ~4,000 requests from one IP; the gateway default is 100 / minute (20 auth attempts / 15 min), which is
#                                   exactly what the NORMAL run keeps. Do not copy these values into any permanent file.
services:
  auth-service:
    environment:
      PARTNER_APPLICATION_DEV_ECHO: "true"
      SMTP_HOST: ""
      SMTP_USER: ""
      SMTP_PASS: ""
  gym-service:
    environment:
      PARTNER_APPLICATION_DEV_ECHO: "true"
  payment-service:
    environment:
      VNPAY_SIMULATE: "true"
      # the simulator still needs a merchant code + hash secret (it signs its own return URL with them): your .env values win, else a play-money placeholder
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-SEEDSIM}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-seed_simulator_hash_secret_placeholder}
  api-gateway:
    environment:
      RATE_LIMIT_MAX_REQUESTS: "100000"
      AUTH_RATE_LIMIT_MAX_REQUESTS: "5000"
      PARTNER_APPLICATION_START_RATE_MAX: "200"
      PARTNER_APPLICATION_RATE_MAX: "5000"
