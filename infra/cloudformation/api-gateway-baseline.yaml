      Action: lambda:InvokeFunction
      FunctionName: !Ref GymLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:ap-southeast-1:191798898985:${HttpApiId}/*/*/me/complaints"
  GymPtGymInvitationsRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "GET /pt/gym-invitations"
      Target: !Sub "integrations/${GymIntegration}"
  GymPtGymInvitationsPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GymLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:ap-southeast-1:191798898985:${HttpApiId}/*/*/pt/gym-invitations"
  GymPtGymInvitationsIdRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "PATCH /pt/gym-invitations/{id}"
      Target: !Sub "integrations/${GymIntegration}"
  GymPtGymInvitationsIdPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GymLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:ap-southeast-1:191798898985:${HttpApiId}/*/*/pt/gym-invitations/{id}"
  GymPtGymAffiliationsRoute:
