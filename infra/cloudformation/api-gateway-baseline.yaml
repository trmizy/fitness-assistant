  "Fn::ForEach::PaymentPrefixRoutes":
    - Prefix
    - - payments
      - me/payments
      - me/wallet
      - me/pt-wallet
      - me/withdrawals
      - admin/payments
    - "Payment&{Prefix}BareRoute":
        Type: AWS::ApiGatewayV2::Route
        DeletionPolicy: Retain
        Properties:
