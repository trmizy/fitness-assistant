  # payment-service's webhook/vnpay-return sub-paths are modeled as their own
  # literal routes, matching live exactly (NOT a generic {proxy+} - see the
  # report's "Route Count Reconciliation" for why this granularity matters).
  PaymentWebhookProviderRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "ANY /payments/webhook/{provider}"
      Target: !Sub "integrations/${PaymentIntegration}"
  PaymentWebhookProviderPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PaymentLambdaArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:ap-southeast-1:191798898985:${HttpApiId}/*/*/payments/webhook/{provider}"
  PaymentWebhookVnpayRoute:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    Properties:
      ApiId: !Ref HttpApiId
