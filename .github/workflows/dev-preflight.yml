# DEV read-only preflight — Lambda baseline + rollback source, BEFORE an application deploy.
#
# READ-ONLY BY CONSTRUCTION. Every AWS call below is a read:
#   sts get-caller-identity · lambda get-function (--query Configuration only: the presigned Code.Location URL is never
#   printed) · s3api list-objects-v2 / head-object on ci-artifacts/ · s3 cp FROM S3 TO the runner (download, to hash it).
# It never calls update-function-code, update-function-configuration, publish-version, invoke, any rds/scheduler/iam API,
# and never writes to S3. Same OIDC role and `environment: dev` as dev-deploy.yml (the role's trust policy only accepts
# repo:<repo>:environment:dev), so it inherits the dev reviewer approval. Needs no IAM change: GyminiDevAppDeployRole already
# allows lambda:GetFunction on the dev functions and s3:GetObject/ListBucket on ci-artifacts/*.
#
# Lambda CodeSha256 is base64(SHA-256 of the deployment ZIP); dev-deploy stores each ZIP at
# ci-artifacts/<service>/<gitSha>/<sha256-hex>.zip — so converting CodeSha256 to hex identifies the exact S3 object (and git
# commit) each function is running, which is the real rollback source.
name: DEV Read-only Preflight (Lambda baseline + rollback source)

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma list of services to inspect"
        required: true
        default: "ai"
      rollback_build_run_id:
        description: "Optional: dev-build run ID of the rollback candidate artifact (e.g. 42614561317)"
        required: false
        default: ""

# Same group as dev-deploy: a preflight never runs while a deploy is mutating the functions it reads.
concurrency:
  group: gymini-dev-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC
  contents: read
  actions: read     # optional: download the rollback-candidate artifact

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "191798898985"
  AWS_PAGER: ""
  DEPLOY_BUCKET: fitness-assistant-deployments-dev-191798898985

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: Validate inputs
        id: svc
        shell: bash
        env: { SERVICES: "${{ inputs.services }}", RB: "${{ inputs.rollback_build_run_id }}" }
        run: |
          set -euo pipefail
          list=""
          for s in ${SERVICES//,/ }; do
            case "$s" in auth|user|fitness|gym|payment|ai) list="$list $s" ;; *) echo "::error::unknown service $s"; exit 1 ;; esac
          done
          [[ -z "$RB" || "$RB" =~ ^[0-9]+$ ]] || { echo "::error::rollback_build_run_id must be numeric"; exit 1; }
          echo "list=${list# }" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4 (pinned)
        with:
          role-to-assume: arn:aws:iam::191798898985:role/GyminiDevAppDeployRole
          aws-region: ap-southeast-1
          role-session-name: gh-preflight-${{ github.run_id }}

      - name: Account gate
        shell: bash
        run: |
          set -euo pipefail
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "$AWS_ACCOUNT_ID" ] || { echo "::error::WRONG_ACCOUNT ($acct)"; exit 1; }
          echo "account verified: $AWS_ACCOUNT_ID ($AWS_REGION)"

      - name: Lambda baseline + running artifact in S3 (read-only)
        shell: bash
        env: { LIST: "${{ steps.svc.outputs.list }}" }
        run: |
          set -euo pipefail
          keys=$(aws s3api list-objects-v2 --bucket "$DEPLOY_BUCKET" --prefix "ci-artifacts/" --query "Contents[].Key" --output text | tr '\t' '\n')
          {
            echo "## DEV preflight (read-only) — account $AWS_ACCOUNT_ID / $AWS_REGION"
            echo "| function | CodeSha256 (base64) | sha256 (hex) | RevisionId | LastModified | State | LastUpdateStatus | PackageType | running artifact in S3 |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          : > running-keys.txt
          for s in $LIST; do
            for f in $(jq -r --arg s "$s" '.services[$s].functions[]' ci/service-impact-map.json); do
              read -r name b64 rev mod state upd pkg < <(aws lambda get-function --function-name "$f" \
                --query "Configuration.[FunctionName,CodeSha256,RevisionId,LastModified,State,LastUpdateStatus,PackageType]" --output text) || true
              [ -n "${b64:-}" ] && [ "${name:-}" = "$f" ] || { echo "::error::GET_FUNCTION_FAILED $f (IAM ACCESS BLOCKED or function missing)"; exit 1; }
              hex=$(printf '%s' "$b64" | base64 -d | od -An -v -tx1 | tr -d ' \n')
              [ "${#hex}" -eq 64 ] || { echo "::error::bad CodeSha256 for $f"; exit 1; }
              key=$(printf '%s\n' "$keys" | grep -E "^ci-artifacts/$s/[0-9a-f]{40}/$hex\.zip$" | head -1 || true)
              echo "$f $b64 $hex $rev $mod $state $upd $pkg ${key:-NOT_FOUND}"
              echo "| $name | \`$b64\` | \`$hex\` | $rev | $mod | $state | $upd | $pkg | ${key:+\`$key\`}${key:-**NOT FOUND in S3**} |" >> "$GITHUB_STEP_SUMMARY"
              [ -n "$key" ] && echo "$key" >> running-keys.txt
            done
          done
          sort -u running-keys.txt -o running-keys.txt

      - name: Re-hash the running artifacts from S3 (download only)
        shell: bash
        run: |
          set -euo pipefail
          echo "### Running artifacts re-hashed from S3" >> "$GITHUB_STEP_SUMMARY"
          while read -r key; do
            [ -z "$key" ] && continue
            aws s3api head-object --bucket "$DEPLOY_BUCKET" --key "$key" --query "[ContentLength,LastModified]" --output text
            aws s3 cp "s3://$DEPLOY_BUCKET/$key" rb.zip --only-show-errors
            got=$(sha256sum rb.zip | cut -d' ' -f1); want=$(basename "$key" .zip)
            [ "$got" = "$want" ] && r="MATCH" || r="**MISMATCH**"
            echo "- \`$key\` → sha256 \`$got\` $r (git \`$(echo "$key" | cut -d/ -f3)\`)" >> "$GITHUB_STEP_SUMMARY"
            rm -f rb.zip
            [ "$got" = "$want" ] || { echo "::error::S3 object hash mismatch $key"; exit 1; }
          done < running-keys.txt

      # Internal-auth configuration of fitness (receiver of /internal/*) and of the ai Lambdas that call it.
      # READ-ONLY: lambda get-function only (already granted). Values are held in shell variables of THIS step, compared with
      # bash builtins, and never printed, hashed, measured, written to a file or passed as a step output / process argument.
      # The JMESPath query keeps only the three variables needed (no other environment data reaches the runner's output).
      # Lambda env vars encrypted with a customer-managed KMS key cannot be read by this role (explicit kms:Decrypt Deny)
      # -> reported as PERMISSION_BLOCKED, never guessed.
      - name: Internal-auth configuration (presence / classification only; values never printed)
        if: ${{ contains(steps.svc.outputs.list, 'fitness') }}
        shell: bash
        run: |
          set +x
          # GitHub runs `shell: bash` as `bash -eo pipefail`: a failed read must be CLASSIFIED below, not abort the step silently.
          set +e
          set -uo pipefail
          RECEIVER=fitness-assistant-dev-fitness
          FUNCS="fitness-assistant-dev-fitness fitness-assistant-dev-fitness-jobs fitness-assistant-dev-ai fitness-assistant-dev-ai-jobs fitness-assistant-dev-ai-worker"
          Q='Configuration.{kms:KMSKeyArn,err:Environment.Error.ErrorCode,iss:Environment.Variables.INTERNAL_SERVICE_SECRET,ias:Environment.Variables.INTERNAL_API_SECRET,ne:Environment.Variables.NODE_ENV}'
          field() { printf '%s' "$1" | jq -r --arg k "$2" '.[$k] // empty' 2>/dev/null; }
          looks_like_ref() { [[ "$1" =~ ^(arn:aws:(secretsmanager|ssm):|\{\{resolve:|ssm:/|/aws/reference/) ]]; }
          {
            echo "### Internal-auth configuration (presence / classification only — no values, hashes or lengths)"
            echo "| function | role | read | INTERNAL_SERVICE_SECRET_PRESENT | INTERNAL_API_SECRET_PRESENT | NODE_ENV_CLASSIFICATION | AUTH_CONFIG_STATUS | INTERNAL_SERVICE_SECRET vs receiver |"
            echo "|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          ref_iss=""; ref_state="UNKNOWN"
          for f in $FUNCS; do
            role=CALLER; [ "$f" = "$RECEIVER" ] && role=RECEIVER; [ "$f" = "fitness-assistant-dev-fitness-jobs" ] && role=JOBS
            j=$(aws lambda get-function --function-name "$f" --query "$Q" --output json 2>/dev/null); rc=$?
            if [ $rc -ne 0 ] || [ -z "$j" ]; then
              why=$(aws lambda get-function --function-name "$f" --query "Configuration.FunctionName" --output text 2>&1 >/dev/null | grep -oE "AccessDenied[A-Za-z]*|ResourceNotFound[A-Za-z]*|KMS[A-Za-z]*" | head -1 || true)
              read_s="PERMISSION_BLOCKED${why:+ ($why)}"; iss_p=UNKNOWN; ias_p=UNKNOWN; ne_c=UNKNOWN; iss=""; iss_known=0
            elif [ -n "$(field "$j" err)" ]; then
              read_s="PERMISSION_BLOCKED (env $(field "$j" err)$( [ -n "$(field "$j" kms)" ] && echo ', customer-managed KMS key'))"
              iss_p=UNKNOWN; ias_p=UNKNOWN; ne_c=UNKNOWN; iss=""; iss_known=0
            else
              read_s=OK; iss_known=1
              iss=$(field "$j" iss); ias=$(field "$j" ias); ne=$(field "$j" ne)
              [ -n "$iss" ] && iss_p=true || iss_p=false
              [ -n "${ias:-}" ] && ias_p=true || ias_p=false
              case "$ne" in production) ne_c=PRODUCTION ;; "") ne_c=UNSET ;; *) ne_c=NON_PRODUCTION ;; esac
              unset ias ne
            fi
            # AUTH_CONFIG_STATUS — mirrors fitness-service internalAuthMiddleware / config/lambda-runtime.ts at this commit
            if [ "$iss_known" -ne 1 ]; then st=UNKNOWN
            elif [ "$role" = RECEIVER ]; then
              if [ "$iss_p" = true ]; then st=RECEIVER_TOKEN_CHECK_ACTIVE
              elif [ "$ne_c" = PRODUCTION ]; then st="FAIL_CLOSED_500 (no INTERNAL_SERVICE_SECRET)"
              else st="**FAIL_OPEN** (no INTERNAL_SERVICE_SECRET and NODE_ENV not production: bare x-user-id trusted)"; fi
            elif [ "$role" = CALLER ]; then
              [ "$iss_p" = true ] && st=CALLER_SENDS_TOKEN || st="**CALLER_TOKEN_MISSING**"
            else
              st="N/A (not an HTTP receiver of /internal/*)"
            fi
            # comparison with the receiver, in memory only
            if [ "$role" = RECEIVER ]; then
              ref_iss="$iss"; [ "$iss_known" -eq 1 ] && { [ -n "$iss" ] && ref_state=SET || ref_state=MISSING; }
              cmp="(receiver)"
            elif [ "$role" = JOBS ]; then cmp="N/A"
            elif [ "$iss_known" -ne 1 ] || [ "$ref_state" = UNKNOWN ]; then cmp=UNKNOWN
            elif [ -z "$iss" ] || [ "$ref_state" = MISSING ]; then cmp=MISSING
            elif looks_like_ref "$iss" || looks_like_ref "$ref_iss"; then cmp=NOT_COMPARABLE
            elif [ "$iss" == "$ref_iss" ]; then cmp=MATCH
            else cmp="**MISMATCH**"; fi
            echo "| $f | $role | $read_s | $iss_p | $ias_p | $ne_c | $st | $cmp |" >> "$GITHUB_STEP_SUMMARY"
            echo "$f role=$role read=${read_s%% *} iss_present=$iss_p ias_present=$ias_p node_env=$ne_c compare=${cmp//\*/}"
            unset j iss
          done
          unset ref_iss
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Source reference: fitness internalAuthMiddleware reads only INTERNAL_SERVICE_SECRET (exact match of x-internal-token); with it unset it trusts bare x-user-id unless NODE_ENV=production. Startup validation also accepts INTERNAL_API_SECRET alone. ai-service callers send x-internal-token=INTERNAL_SERVICE_SECRET via direct Lambda invoke. Endpoint exposure (API Gateway routes, Function URL, resource policy) is NOT read by this workflow._" >> "$GITHUB_STEP_SUMMARY"

      - name: Download rollback-candidate artifact (optional)
        if: ${{ inputs.rollback_build_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (pinned)
        with:
          pattern: lambda-*
          path: rollback-candidate
          run-id: ${{ inputs.rollback_build_run_id }}
          github-token: ${{ github.token }}

      - name: Compare rollback candidate with what is running (optional)
        if: ${{ inputs.rollback_build_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "### Rollback candidate (build run ${{ inputs.rollback_build_run_id }})" >> "$GITHUB_STEP_SUMMARY"
          for m in $(find rollback-candidate -name '*.manifest.json'); do
            zip="${m%.manifest.json}.zip"; svc=$(jq -r .service "$m"); want=$(jq -r .sha256 "$m"); gsha=$(jq -r .gitSha "$m")
            got=$(sha256sum "$zip" | cut -d' ' -f1)
            running=$(grep -c "/$want\.zip$" running-keys.txt || true)
            echo "- $svc git \`$gsha\` zip sha256 \`$got\` manifest $([ "$got" = "$want" ] && echo MATCH || echo MISMATCH); currently running: $([ "$running" -gt 0 ] && echo YES || echo NO)" >> "$GITHUB_STEP_SUMMARY"
          done
