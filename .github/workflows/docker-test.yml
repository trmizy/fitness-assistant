name: Docker Fast Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Root build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: Fast Docker test
        run: pnpm docker:test:fast