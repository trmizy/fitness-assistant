name: Docker Fast Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast-docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Root build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: AI evaluation tests (structural/policy regressions)
        run: pnpm --filter @gym-coach/ai-service run test:evaluation
      - name: AI policy behavior tests (routing/safety regressions)
        run: pnpm --filter @gym-coach/ai-service run test:policy
      - name: Fast Docker test
        run: pnpm docker:test:fast

  # Critical DB Integration gate (2026-09-15) — a small, Postgres-only
  # release gate for database-backed business invariants that
  # fast-docker-test above deliberately never exercises (it runs no
  # Postgres at all). Independent of `fast-docker-test` (no `needs:`) so a
  # DB regression is caught even if lint/build is still running, and a
  # slow/flaky lint step never hides a real DB-invariant break.
  #
  # Scope is intentionally narrow: 4 test files covering equipment
  # eligibility semantics, apply-plan idempotency/stale-fingerprint, PT
  # contract idempotency/stale-state, and ClientJourney concurrent-write
  # idempotency — the concrete DB-backed regressions found and closed
  # during the Training Program Recommendation v2 / PT Phase-4 hardening
  # passes (see docs/training-program-recommendation-v2-score-design.md,
  # docs/ai-agent-hardening-fix-report.md). This is NOT the full ~230-file
  # integration suite — see docs/training-program-recommendation-evaluation.md
  # for why running that as one mega-process in CI was rejected (real
  # Postgres connection/transaction-timeout resource exhaustion observed
  # locally, unrelated to any of these 4 files).
  #
  # No Ollama/Qdrant: none of these 4 files call an LLM or vector search —
  # confirmed by direct inspection, not assumed.
  db-integration:
    name: Critical DB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis-test:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gymcoach_test
          POSTGRES_PASSWORD: gymcoach_test_password
          POSTGRES_DB: gymcoach_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U gymcoach_test -d gymcoach_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Same host:port convention as local dev (docker-compose.test.yml's
      # postgres-test service) — a contributor reproduces this job locally
      # with the exact same DATABASE_URL values used here.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "55433"
      POSTGRES_USER: gymcoach_test
      POSTGRES_PASSWORD: gymcoach_test_password
      FITNESS_DISABLE_REDIS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create isolated test databases
        run: node scripts/ci-create-test-databases.mjs
      - name: Generate Prisma clients
        run: pnpm run prisma:generate
      - name: Apply canonical test-DB migrations (prisma migrate deploy — never db push, see scripts/prisma-test.mjs)
        run: pnpm run prisma:migrate:test
      - name: Verify fitness-service migration status (guards against the exact P2021 "table does not exist" regression this job exists to prevent)
        working-directory: backend/services/fitness-service
        env:
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_fitness_test?schema=public
        run: npx prisma migrate status
      - name: Equipment eligibility DB regression (REQUIRED / ALTERNATIVE / OPTIONAL semantics)
        working-directory: backend/services/fitness-service
        env:
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_fitness_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/agent-program-equipment-semantics.test.ts
      - name: Apply-plan idempotency + stale-fingerprint DB regression
        working-directory: backend/services/fitness-service
        env:
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_fitness_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/agent-program-apply-idempotency.test.ts
      - name: PT contract idempotency + stale-state DB regression
        working-directory: backend/services/user-service
        env:
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_user_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/agentic-contract-idempotency.test.ts
      - name: ClientJourney concurrency/idempotency DB regression
        working-directory: backend/services/user-service
        env:
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_user_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/client-journey-derivation-idempotency.test.ts
      # AI Coach core gates (2026-09-20 production-readiness pass). Protect the SIGNED-OFF conversational
      # workflow foundation + product capabilities against regression: workflow/product/race suites run against the
      # isolated ai test DB, nutrition target/bootstrap against the isolated fitness test DB. No LLM/provider is
      # required (LLM_PROVIDER=mock; the suites stub every network boundary themselves). Live BullMQ/provider
      # journeys are a MANUAL/NIGHTLY release gate (docs/ai-coach-production-demo-readiness.md).
      - name: AI Coach core gates - conversational workflow, product remediation, finalization race, exclusions
        working-directory: backend/services/ai-service
        env:
          NODE_ENV: test
          LLM_PROVIDER: mock
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_ai_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/agent-workflow-*.test.ts src/__tests__/nutrition-food-exclusion.test.ts src/__tests__/slot-values-parsers.test.ts
      - name: AI Coach core gates - foundation evaluator (Codex conversational-workflow v2, must stay 30/30)
        env:
          NODE_ENV: test
          LLM_PROVIDER: mock
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_ai_test?schema=public
        run: node scripts/ci-check-foundation-evaluator.mjs
      - name: AI Coach core gates - authoritative nutrition target + bootstrap (fitness-service)
        working-directory: backend/services/fitness-service
        env:
          FITNESS_DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_fitness_test?schema=public
          DATABASE_URL: postgresql://gymcoach_test:gymcoach_test_password@localhost:55433/gymcoach_fitness_test?schema=public
        run: npx tsx --test --test-force-exit src/__tests__/nutrition-target-resolution.integration.test.ts src/__tests__/nutrition-onboarding-bootstrap.integration.test.ts src/__tests__/nutrition-bootstrap.engine.test.ts
