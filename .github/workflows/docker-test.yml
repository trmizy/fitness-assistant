name: Docker Fast Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  fast-docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Root build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test
      - name: AI evaluation tests (structural/policy regressions)
        run: pnpm --filter @gym-coach/ai-service run test:evaluation
      - name: AI policy behavior tests (routing/safety regressions)
        run: pnpm --filter @gym-coach/ai-service run test:policy
      - name: Fast Docker test
        run: pnpm docker:test:fast
